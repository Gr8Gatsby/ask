<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#0D0B08"/>

  <!-- Remote body outer -->
  <rect x="307" y="77" width="410" height="870" rx="154" fill="#3D3626"/>
  <!-- Remote body inner -->
  <rect x="326" y="96" width="372" height="832" rx="135" fill="#342E1E"/>

  <!-- Speaker bar -->
  <rect x="422" y="160" width="180" height="32" rx="16" fill="#4A4230"/>

  <!-- Amber LED -->
  <circle cx="512" cy="237" r="22" fill="#F59E0B"/>
  <circle cx="512" cy="237" r="42" fill="#F59E0B" opacity="0.18"/>

  <!-- Action button ring shadow -->
  <circle cx="512" cy="500" r="166" fill="#251F12"/>
  <!-- Action button -->
  <circle cx="512" cy="500" r="147" fill="#F59E0B"/>
  <!-- Inner ring detail -->
  <circle cx="512" cy="500" r="115" fill="none" stroke="#D08500" stroke-width="8"/>
  <!-- Play triangle -->
  <polygon points="474,444 474,556 608,500" fill="#0D0B08"/>

  <!-- Divider line -->
  <rect x="352" y="724" width="320" height="6" rx="3" fill="#4A4230"/>

  <!-- D-pad horizontal bar -->
  <rect x="428" y="782" width="168" height="58" rx="29" fill="#3D3626"/>
  <!-- D-pad vertical bar -->
  <rect x="483" y="727" width="58" height="168" rx="29" fill="#3D3626"/>
  <!-- D-pad center circle -->
  <circle cx="512" cy="811" r="26" fill="#2A2418"/>

  <!-- D-pad chevrons -->
  <!-- Up -->
  <polyline points="493,751 512,732 531,751" fill="none" stroke="#7A6E54" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Down -->
  <polyline points="493,871 512,890 531,871" fill="none" stroke="#7A6E54" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left -->
  <polyline points="452,792 433,811 452,830" fill="none" stroke="#7A6E54" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right -->
  <polyline points="572,792 591,811 572,830" fill="none" stroke="#7A6E54" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
