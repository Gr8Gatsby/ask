<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="44" fill="#007AFF"/>
  <!-- Latitude lines -->
  <ellipse cx="50" cy="50" rx="44" ry="18" fill="none" stroke="white" stroke-width="2.5" opacity="0.7"/>
  <!-- Meridian -->
  <ellipse cx="50" cy="50" rx="22" ry="44" fill="none" stroke="white" stroke-width="2.5" opacity="0.7"/>
  <!-- Equator -->
  <line x1="6" y1="50" x2="94" y2="50" stroke="white" stroke-width="2.5" opacity="0.7"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="white" stroke-width="3"/>
</svg>
