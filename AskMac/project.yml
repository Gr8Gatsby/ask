name: AskMac
options:
  bundleIdPrefix: com.kevinhill
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  base:
    DEVELOPMENT_TEAM: B5J28L8ARB
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  AskMacCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/AskMacCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinhill.askmaccore
        SKIP_INSTALL: YES
    scheme:
      testTargets:
        - AskMacTests

  AskMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/AskMac
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
    info:
      path: Sources/AskMac/Info.plist
      properties:
        CFBundleIdentifier: com.kevinhill.askmac
        CFBundleName: AskMac
        CFBundleDisplayName: AskMac
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Kevin Hill"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        SUFeedURL: "https://raw.githubusercontent.com/Gr8Gatsby/ask/main/docs/appcast.xml"
        SUPublicEDKey: "jbCfz3kJ7jtaLmJd5HTmZc1o0I5nLB+JBxTPbdqfFyQ="
    entitlements:
      path: Sources/AskMac/AskMac.entitlements
      properties:
        com.apple.application-identifier: B5J28L8ARB.com.kevinhill.askmac
        com.apple.developer.icloud-container-identifiers:
          - iCloud.simple.ask
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-environment: Production
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinhill.askmac
        MARKETING_VERSION: "1.4.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application: Kevin Hill (B5J28L8ARB)"
        PROVISIONING_PROFILE_SPECIFIER: "036fee16-227d-478a-a99e-021fe8ec952d"
        CODE_SIGN_ENTITLEMENTS: Sources/AskMac/AskMac.entitlements
        CLOUDKIT_ENVIRONMENT: PRODUCTION
    dependencies:
      - target: AskMacCore
      - package: Sparkle
        product: Sparkle

  AskMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AskMacTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AskMac.app/Contents/MacOS/AskMac
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: AskMacCore
      - target: AskMac
        embed: false

  AskMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/AskMacUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AskMac
    dependencies:
      - target: AskMac

schemes:
  AskMac:
    build:
      targets:
        AskMac: all
        AskMacTests: [test]
        AskMacUITests: [test]
    test:
      targets:
        - AskMacTests
        - AskMacUITests
    archive:
      config: Release

  AskMac (First Run):
    build:
      targets:
        AskMac: all
    run:
      config: Debug
      preActions:
        - name: Reset first-run state
          script: |
            rm -rf "$HOME/.ask/dev-vault"
            /usr/bin/defaults delete com.kevinhill.askmac hasSeenOnboarding 2>/dev/null || true
            /usr/bin/defaults delete com.kevinhill.askmac usesBundledScripts 2>/dev/null || true
            /usr/bin/defaults delete com.kevinhill.askmac permissionsMigrationDone 2>/dev/null || true
            /usr/bin/defaults delete com.kevinhill.askmac knownScriptsMigrationDone 2>/dev/null || true
            /usr/bin/defaults delete com.kevinhill.askmac knownScripts 2>/dev/null || true
            /usr/bin/defaults delete com.kevinhill.askmac pinnedScripts 2>/dev/null || true
          settingsTarget: AskMac
