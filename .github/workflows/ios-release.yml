name: iOS Release Validation

# Validates that the tagged commit builds cleanly.
# Signing and TestFlight upload are handled locally via scripts/release-ios.sh.

on:
  push:
    tags:
      - 'ios-v*'

jobs:
  validate:
    name: Validate iOS release build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project ask/ask.xcodeproj \
            -scheme ask \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty 2>/dev/null || true
