name: Staple Release Artifacts

# Runs on macOS Sequoia (15.x) to staple notarization tickets to PKG and DMG.
# Also staples the .app bundle itself and re-uploads it as AskMac-{version}.app.zip,
# which is the correct format for Gatekeeper on macOS 26+: the .app bundle must carry
# an embedded ticket, not just the outer DMG container.
#
# Background: on macOS Tahoe 26.x, Gatekeeper cannot verify tickets embedded in DMG or
# PKG containers (Error 65 regression). It CAN verify tickets embedded in .app bundles.
# Providing a stapled .app.zip lets users install by drag-drop without hitting this bug.
# See: https://github.com/Gr8Gatsby/ask/issues/32
#
# Triggered automatically when a release is published, or manually for a specific tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to staple (e.g. v0.7.2)"
        required: true

jobs:
  staple:
    runs-on: macos-15
    permissions:
      contents: write   # needed to upload release assets
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            VERSION="${{ inputs.tag }}"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            VERSION="${{ github.event.release.tag_name }}"
          fi
          # Strip 'v' prefix for filenames (v0.7.2 → 0.7.2)
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          echo "Downloading artifacts for $TAG…"
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "AskMac-*.dmg" \
            --pattern "AskMac-*.pkg" \
            --pattern "AskMac-${VERSION}.app.zip" \
            --dir artifacts
          ls -lh artifacts/

      - name: Staple PKG and DMG containers
        id: staple
        run: |
          STAPLED=""
          FAILED=""
          for f in artifacts/AskMac-*.pkg artifacts/AskMac-*.dmg; do
            [[ -f "$f" ]] || continue
            name="$(basename "$f")"
            echo "==> Stapling $name…"
            if xcrun stapler staple "$f"; then
              echo "    ✅ Stapled $name"
              STAPLED="$STAPLED $f"
            else
              echo "    ❌ Staple failed for $name (record not found — not notarized?)"
              FAILED="$FAILED $name"
            fi
          done
          echo "stapled=${STAPLED# }" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED# }" >> "$GITHUB_OUTPUT"

      - name: Staple .app bundle and repack zip
        id: staple_app
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          APP_ZIP="artifacts/AskMac-${VERSION}.app.zip"
          if [[ ! -f "$APP_ZIP" ]]; then
            echo "No app zip found at $APP_ZIP — skipping (build may predate this feature)"
            echo "stapled_app=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "==> Extracting .app from zip…"
          mkdir -p /tmp/app-staple
          ditto -x -k "$APP_ZIP" /tmp/app-staple/
          APP_PATH=$(find /tmp/app-staple -maxdepth 1 -name "*.app" | head -1)
          if [[ -z "$APP_PATH" ]]; then
            echo "ERROR: No .app found inside $APP_ZIP"
            echo "stapled_app=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "==> Stapling $(basename "$APP_PATH")…"
          if xcrun stapler staple "$APP_PATH"; then
            echo "    ✅ Stapled $(basename "$APP_PATH")"
            echo "==> Repacking stapled .app into zip…"
            STAPLED_ZIP="/tmp/AskMac-${VERSION}.app.zip"
            ditto -c -k --keepParent "$APP_PATH" "$STAPLED_ZIP"
            cp "$STAPLED_ZIP" "$APP_ZIP"
            echo "stapled_app=$APP_ZIP" >> "$GITHUB_OUTPUT"
          else
            echo "    ❌ Staple failed for $(basename "$APP_PATH")"
            echo "stapled_app=" >> "$GITHUB_OUTPUT"
          fi
          rm -rf /tmp/app-staple /tmp/AskMac-*.app.zip

      - name: Re-upload stapled artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          UPLOAD_LIST=""
          [[ -n "${{ steps.staple.outputs.stapled }}" ]] && UPLOAD_LIST="$UPLOAD_LIST ${{ steps.staple.outputs.stapled }}"
          [[ -n "${{ steps.staple_app.outputs.stapled_app }}" ]] && UPLOAD_LIST="$UPLOAD_LIST ${{ steps.staple_app.outputs.stapled_app }}"
          if [[ -z "$UPLOAD_LIST" ]]; then
            echo "Nothing to upload."
            exit 0
          fi
          echo "Uploading stapled artifacts to $TAG…"
          # shellcheck disable=SC2086
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            --clobber \
            $UPLOAD_LIST
          echo "✅ Uploaded: $UPLOAD_LIST"

      - name: Report
        run: |
          if [[ -n "${{ steps.staple.outputs.stapled }}" ]]; then
            echo "✅ Stapled PKG/DMG: ${{ steps.staple.outputs.stapled }}"
          fi
          if [[ -n "${{ steps.staple_app.outputs.stapled_app }}" ]]; then
            echo "✅ Stapled .app zip: ${{ steps.staple_app.outputs.stapled_app }}"
          fi
          if [[ -n "${{ steps.staple.outputs.failed }}" ]]; then
            echo "⚠️  Not stapled (missing notarization): ${{ steps.staple.outputs.failed }}"
            echo "   Fix: ensure build script submits all artifacts to notarytool."
            exit 1
          fi
