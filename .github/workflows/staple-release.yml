name: Staple Release Artifacts

# Runs on macOS Sequoia (15.x) to staple notarization tickets to PKG and DMG.
# Needed because xcrun stapler fails on macOS Tahoe 26.x (Error 65 — CloudKit
# ticket validation broken in current production macOS). See issue #32.
# Triggered automatically when a release is published, or manually for a specific tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to staple (e.g. v0.7.2)"
        required: true

jobs:
  staple:
    runs-on: macos-15
    permissions:
      contents: write   # needed to upload release assets
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download PKG and DMG from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Downloading artifacts for $TAG…"
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "AskMac-*.dmg" \
            --pattern "AskMac-*.pkg" \
            --dir artifacts
          ls -lh artifacts/

      - name: Verify notarization before stapling
        run: |
          for f in artifacts/AskMac-*.pkg artifacts/AskMac-*.dmg; do
            [[ -f "$f" ]] || continue
            echo "==> $(basename $f)"
            spctl --assess --verbose --type install "$f" 2>&1 || true
          done

      - name: Staple all artifacts
        id: staple
        run: |
          STAPLED=""
          FAILED=""
          for f in artifacts/AskMac-*.pkg artifacts/AskMac-*.dmg; do
            [[ -f "$f" ]] || continue
            name="$(basename $f)"
            echo "==> Stapling $name…"
            if xcrun stapler staple "$f"; then
              echo "    ✅ Stapled $name"
              STAPLED="$STAPLED $f"
            else
              echo "    ❌ Staple failed for $name (record not found — not notarized?)"
              FAILED="$FAILED $name"
            fi
          done
          # Export for later steps (trim leading space)
          echo "stapled=${STAPLED# }" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED# }" >> "$GITHUB_OUTPUT"
          # Don't fail here — upload what we have, report at end

      - name: Re-upload stapled artifacts
        if: steps.staple.outputs.stapled != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Uploading stapled artifacts to $TAG…"
          # shellcheck disable=SC2086
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            --clobber \
            ${{ steps.staple.outputs.stapled }}
          echo "✅ Uploaded: ${{ steps.staple.outputs.stapled }}"

      - name: Report
        run: |
          if [[ -n "${{ steps.staple.outputs.stapled }}" ]]; then
            echo "✅ Stapled and uploaded: ${{ steps.staple.outputs.stapled }}"
          fi
          if [[ -n "${{ steps.staple.outputs.failed }}" ]]; then
            echo "⚠️  Not stapled (missing notarization): ${{ steps.staple.outputs.failed }}"
            echo "   These artifacts were not notarized via notarytool before upload."
            echo "   Fix: ensure build script submits all DMGs to notarytool."
            exit 1
          fi
