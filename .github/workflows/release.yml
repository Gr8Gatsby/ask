name: Release Validation

# Validates that the tagged commit builds cleanly.
# Signing, notarization, and publishing are handled locally via scripts/build-release.sh.

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate Mac release build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: AskMac

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test
